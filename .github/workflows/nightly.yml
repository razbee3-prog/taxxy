name: Nightly evals (Tier 2 + Tier 3)

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/agent/skills/**"
      - "apps/agent/src/agent.ts"
      - "packages/integrations/src/categorize/**"
      - "packages/engine/src/constants/**"
      - "packages/evals/**"
      - "apps/agent/experiments/**"

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.8.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 surrealdb/surrealdb:v3 start --user root --pass root memory
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - run: pnpm install --frozen-lockfile
      - name: Tier 2 (live categorizer on fixture labels)
        run: pnpm --filter @taxxy/evals tier2
        continue-on-error: true
      - name: Tier 3 deterministic gate (no Langfuse needed)
        run: pnpm --filter @taxxy/agent tier3 deterministic
      - name: Sync Tier 3 dataset to Langfuse
        if: env.LANGFUSE_SECRET_KEY != ''
        run: pnpm --filter @taxxy/evals sync-datasets
      - name: Tier 3 experiment gate (Langfuse experiment-action)
        if: env.LANGFUSE_SECRET_KEY != ''
        uses: langfuse/experiment-action@v1
        env:
          TIER3_MODE: ${{ github.event_name == 'pull_request' && 'deterministic' || 'agent' }}
        with:
          langfuse_public_key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}
          langfuse_base_url: ${{ secrets.LANGFUSE_BASE_URL }}
          experiment_path: apps/agent/experiments/tier3-gate.ts
          dataset_name: taxxy-tier3-profiles
          should_skip_sdk_installation: "true"
          github_token: ${{ github.token }}
